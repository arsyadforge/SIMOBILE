<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Riwayat Transaksi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Riwayat Transaksi</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Daftar Riwayat Transaksi -->
  <ion-list *ngIf="transactions.length > 0; else emptyTx">
    <ion-item *ngFor="let tx of transactions; let i = index" (click)="viewDetail(i)" detail="true">
      <ion-label>
        <h2><b>Transaksi #{{ i + 1 }}</b></h2>
        <p>Tanggal: {{ tx.date | date:'medium' }}</p>
        <p>Total Item: {{ tx.items.length }} jenis barang</p>
      </ion-label>
      <ion-badge slot="end" color="success">Rp {{ tx.total }}</ion-badge>
    </ion-item>
  </ion-list>

  <!-- Tampilan Jika Belum Ada Transaksi -->
  <ng-template #emptyTx>
    <div style="text-align: center; margin-top: 50px;">
      <ion-icon name="receipt-outline" style="font-size: 64px; color: gray;"></ion-icon>
      <p>Belum ada riwayat transaksi.</p>
    </div>
  </ng-template>
</ion-content>
