<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Card 1: Jumlah Produk -->
  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>Jumlah Produk</ion-card-subtitle>
      <ion-card-title>{{ jumlahProduk }} Produk</ion-card-title>
    </ion-card-header>
  </ion-card>

  <!-- Card 2: Transaksi Hari Ini & Total Penjualan -->
  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>Transaksi Hari Ini</ion-card-subtitle>
      <ion-card-title>{{ jumlahTransaksiHariIni }} Transaksi</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Total Penjualan: Rp {{ totalPenjualanHariIni.toLocaleString('id-ID') }}
    </ion-card-content>
  </ion-card>

  <!-- Card 3: Produk Terlaris (Wajib Tambahkan Ini) -->
  <ion-card color="warning">
    <ion-card-header>
      <ion-card-subtitle>Produk Terlaris</ion-card-subtitle>
      <ion-card-title>{{ produkTerlaris }}</ion-card-title>
    </ion-card-header>
  </ion-card>
</ion-content>
