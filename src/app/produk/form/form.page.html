<ion-header [translucent]="true">

  <ion-toolbar>


    <!-- Tombol kembali ke halaman sebelumnya -->
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/produk"></ion-back-button>
    </ion-buttons>

    <!-- Judul halaman -->
    <ion-title>
      {{ isEdit ? 'Edit Produk' : 'Tambah Produk' }}
    </ion-title>

  </ion-toolbar>

</ion-header>


<ion-content [fullscreen]="true">

  <!-- Form produk -->
  <form [formGroup]="produkForm" (ngSubmit)="submitProduk()">

    <ion-list>


      <!-- ========================= -->
      <!-- NAMA PRODUK -->
      <!-- ========================= -->

      <ion-item>

        <ion-input label="Nama Produk" labelPlacement="stacked" type="text" formControlName="nama"
          placeholder="Masukkan nama produk">
        </ion-input>

      </ion-item>


      <!-- Validasi nama -->
      <ion-text color="danger" *ngIf="
          produkForm.get('nama')?.touched &&
          produkForm.get('nama')?.invalid
        ">

        <p>
          Nama produk wajib diisi.
        </p>

      </ion-text>



      <!-- ========================= -->
      <!-- HARGA BELI -->
      <!-- ========================= -->

      <ion-item>

        <ion-input label="Harga Beli" labelPlacement="stacked" type="number" formControlName="harga" step="1000"
          placeholder="Masukkan harga beli">
        </ion-input>

      </ion-item>


      <!-- Validasi harga beli -->
      <ion-text color="danger" *ngIf="
          produkForm.get('harga')?.touched &&
          produkForm.get('harga')?.invalid
        ">

        <p *ngIf="
            produkForm.get('harga')?.errors?.['required']
          ">

          Harga beli wajib diisi.

        </p>


        <p *ngIf="
            produkForm.get('harga')?.errors?.['min']
          ">

          Harga beli harus lebih dari 0.

        </p>

      </ion-text>



      <!-- ========================= -->
      <!-- HARGA JUAL -->
      <!-- ========================= -->

      <ion-item>

        <ion-input label="Harga Jual" labelPlacement="stacked" type="number" formControlName="hargaJual" step="1000"
          placeholder="Masukkan harga jual">
        </ion-input>

      </ion-item>


      <!-- Validasi harga jual -->
      <ion-text color="danger" *ngIf="
          produkForm.get('hargaJual')?.touched &&
          produkForm.get('hargaJual')?.invalid
        ">

        <p *ngIf="
            produkForm.get('hargaJual')?.errors?.['required']
          ">

          Harga jual wajib diisi.

        </p>


        <p *ngIf="
            produkForm.get('hargaJual')?.errors?.['min']
          ">

          Harga jual harus lebih dari 0.

        </p>

      </ion-text>



      <!-- ========================= -->
      <!-- STOK -->
      <!-- ========================= -->

      <ion-item>

        <ion-input label="Stok" labelPlacement="stacked" type="number" formControlName="stok" step="1"
          placeholder="Masukkan stok">
        </ion-input>

      </ion-item>


      <!-- Validasi stok -->
      <ion-text color="danger" *ngIf="
          produkForm.get('stok')?.touched &&
          produkForm.get('stok')?.invalid
        ">

        <p *ngIf="
            produkForm.get('stok')?.errors?.['required']
          ">

          Stok wajib diisi.

        </p>


        <p *ngIf="
            produkForm.get('stok')?.errors?.['min']
          ">

          Stok tidak boleh negatif.

        </p>

      </ion-text>


    </ion-list>



    <!-- ========================= -->
    <!-- TOMBOL SIMPAN / UPDATE -->
    <!-- ========================= -->

    <ion-button expand="block" type="submit" [disabled]="produkForm.invalid">

      {{ isEdit ? 'UPDATE' : 'SIMPAN' }}

    </ion-button>


  </form>

</ion-content>
