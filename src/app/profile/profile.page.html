<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Profil Saya</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <!-- Bagian Foto dan Identitas Utama -->
  <div style="text-align: center; margin-top: 30px; margin-bottom: 30px;">
    <ion-avatar style="width: 120px; height: 120px; margin: 0 auto;">
      <img src="https://ionicframework.com/docs/img/demos/avatar.svg" alt="Foto Profil" />
    </ion-avatar>
    <!-- Menampilkan Nama -->
    <h2 style="margin-top: 15px; font-weight: bold;">{{ userData?.name }}</h2>
    <!-- Menampilkan Username -->
    <p style="color: gray;">&#64;{{ userData?.username }}</p>
  </div>

  <!-- Detail Informasi -->
  <ion-list lines="full">
    <ion-item>
      <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h3>Nama </h3>
        <p>{{ userData?.name }}</p>
      </ion-label>
    </ion-item>
    
    <ion-item>
      <ion-icon name="at-circle-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h3>Username</h3>
        <p>{{ userData?.username }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <!-- Tombol Logout -->
  <ion-button expand="block" color="danger" style="margin-top: 40px;" (click)="prosesLogout()">
    <ion-icon name="log-out-outline" slot="start"></ion-icon>
    Keluar (Logout)
  </ion-button>
</ion-content>
