<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">login</ion-title>
    </ion-toolbar>
  </ion-header>
  
  <ion-list>
    <ion-item>
      <ion-input label="Username" labelPlacement="floating"
        placeholder="Masukkan username" [(ngModel)]="username">
      </ion-input>
    </ion-item>
    <ion-item>
      <ion-input type="password" label="Password" labelPlacement="floating"
        placeholder="Masukkan password" [(ngModel)]="password">
      </ion-input>
    </ion-item>
    <ion-item *ngIf="errorMessage != ''">
      <ion-text color="danger">{{errorMessage}}</ion-text>
    </ion-item>
    <ion-item>
      <ion-button expand="block" (click)="doLogin()">Masuk</ion-button>
    </ion-item>
  </ion-list>
</ion-content>
